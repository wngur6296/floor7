<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="정연빌딩 7층">
<meta name="theme-color" content="#0d0d0c">
<meta name="description" content="정연빌딩 7층 — 다음 지시가 있을 때까지. 브라우저에서 바로 하는 1인칭 심리 공포 탐험 게임.">
<title>정연빌딩 7층</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<link rel="preload" href="assets/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div>
<div id="vignette"></div>

<!-- ── HUD ── -->
<div id="hud">
  <div id="cross"></div>
  <button id="prompt" type="button"><span class="pk">E</span><span class="pt"></span></button>
  <div id="sub"><span class="who"></span><span class="txt"></span></div>
  <div id="inv"></div>
  <div id="toasts"></div>
  <div id="saveInd"><i></i>저장 중</div>
  <button id="btnPause" type="button" aria-label="일시정지"><span></span><span></span></button>
</div>
<div id="joy"><div id="joyKnob"></div></div>
<div id="modal" class="modal"></div>

<!-- ── 로딩 ── -->
<section id="loading" class="screen on">
  <div class="ld"><div class="brand"><b>정연빌딩 7층</b><small>THE NEXT INSTRUCTION</small></div><div class="ldbar"><i id="ldfill"></i></div><div class="ldmsg" id="ldmsg">출근 준비 중</div></div>
</section>

<!-- ── 메인 메뉴 ── -->
<section id="menu" class="screen menu-screen">
  <div class="shade"></div>
  <div class="mcol">
    <header class="brand big"><small class="eyebrow">주식회사 정연 · 7F</small><h1 id="tname">정연빌딩 7층</h1><p id="tsub">다음 지시가 있을 때까지</p></header>
    <nav class="mlist" id="mainNav">
      <button data-act="continue" id="mContinue"><span class="lbl">이어하기</span><span class="aux" id="mContAux"></span></button>
      <button data-act="new"><span class="lbl">새 게임</span><span class="aux">출근하기</span></button>
      <button data-act="load"><span class="lbl">불러오기</span></button>
      <button data-act="settings"><span class="lbl">설정</span></button>
      <button data-act="achs"><span class="lbl">도전과제</span><span class="aux" id="mAchAux"></span></button>
      <button data-act="gallery"><span class="lbl">엔딩 갤러리 · 기록</span><span class="aux" id="mEndAux"></span></button>
      <button data-act="credits"><span class="lbl">크레딧</span></button>
    </nav>
    <footer class="mfoot"><span id="profileLine"></span><span class="keys">↑↓ 선택 · Enter 확인 · Esc 뒤로</span></footer>
  </div>
  <div class="ver">v1.1 · 🎧 헤드폰 권장</div>
</section>

<!-- ── 일시정지 ── -->
<section id="pause" class="screen menu-screen glass">
  <div class="shade"></div>
  <div class="mcol">
    <header class="brand"><small class="eyebrow">일시정지</small><h2 id="pRoom">—</h2><p id="pinfo"></p></header>
    <nav class="mlist">
      <button data-act="resume"><span class="lbl">계속하기</span></button>
      <button data-act="save"><span class="lbl">저장하기</span></button>
      <button data-act="load"><span class="lbl">불러오기</span></button>
      <button data-act="settings"><span class="lbl">설정</span></button>
      <button data-act="achs"><span class="lbl">도전과제</span></button>
      <button data-act="restart"><span class="lbl">처음부터 다시 출근</span></button>
      <button data-act="quit"><span class="lbl">메인 메뉴로</span></button>
    </nav>
    <footer class="mfoot"><span class="keys">이동 — 왼쪽 드래그 · WASD　시점 — 오른쪽 드래그 · 마우스　조사 — 탭 · 클릭 · E</span></footer>
  </div>
</section>

<!-- ── 저장 슬롯 ── -->
<section id="slots" class="screen sub-screen">
  <div class="sheet">
    <header class="shead"><button class="back" data-nav aria-label="뒤로">‹</button><div><small class="eyebrow" id="slotEyebrow">기록</small><h2 id="slotTitle">불러오기</h2></div></header>
    <div class="slotgrid" id="slotGrid"></div>
    <p class="note" id="slotNote">자동 저장은 방에 들어갈 때마다 갱신됩니다.</p>
  </div>
</section>

<!-- ── 설정 ── -->
<section id="settings" class="screen sub-screen">
  <div class="sheet">
    <header class="shead"><button class="back" data-nav aria-label="뒤로">‹</button><div><small class="eyebrow">환경</small><h2>설정</h2></div></header>
    <div class="tabs" id="setTabs"></div>
    <div class="setbody" id="setBody"></div>
    <footer class="sfoot"><button id="bDefaults" data-nav class="ghost">기본값 복원</button><button id="bWipe" data-nav class="ghost danger">모든 기록 지우기</button></footer>
  </div>
</section>

<!-- ── 도전과제 ── -->
<section id="achs" class="screen sub-screen">
  <div class="sheet">
    <header class="shead"><button class="back" data-nav aria-label="뒤로">‹</button><div><small class="eyebrow">기록</small><h2>도전과제</h2></div><div class="prog"><b id="achCount"></b><i><em id="achBar"></em></i></div></header>
    <div class="alist" id="achList"></div>
  </div>
</section>

<!-- ── 엔딩 갤러리 / 기록 ── -->
<section id="gallery" class="screen sub-screen">
  <div class="sheet">
    <header class="shead"><button class="back" data-nav aria-label="뒤로">‹</button><div><small class="eyebrow">기록</small><h2>엔딩 갤러리</h2></div><div class="prog"><b id="endCount"></b><i><em id="endBar"></em></i></div></header>
    <div class="tabs" id="galTabs"><button data-tab="end" data-nav class="on">엔딩</button><button data-tab="rec" data-nav>기록</button></div>
    <div class="egrid" id="endList"></div>
    <div class="stats" id="statList" hidden></div>
  </div>
</section>

<!-- ── 크레딧 ── -->
<section id="credits" class="screen sub-screen">
  <div class="sheet narrow">
    <header class="shead"><button class="back" data-nav aria-label="뒤로">‹</button><div><small class="eyebrow">정연빌딩 7층</small><h2>크레딧</h2></div></header>
    <div class="credits" id="creditBody"></div>
  </div>
</section>

<!-- ── 결말 ── -->
<section id="ending" class="screen">
  <div class="einner">
    <div class="enum" id="eNum"></div>
    <h2 id="eName"></h2>
    <div class="erule"></div>
    <pre id="eText"></pre>
    <div class="enew" id="eNew">새 결말</div>
    <nav class="ebtns"><button id="bAgain" class="primary" data-nav>다시 출근하기</button><button id="bEndTitle" data-nav>메인 메뉴</button><button id="bEndWipe" class="danger" data-nav style="display:none">기록 지우기</button></nav>
  </div>
</section>

<!-- ── 확인 대화상자 ── -->
<div id="confirm" class="confirm"><div class="cbox"><h3 id="cTitle"></h3><p id="cMsg"></p><div class="cbtns"><button id="cNo" data-nav>취소</button><button id="cYes" data-nav class="primary">확인</button></div></div></div>

<noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
